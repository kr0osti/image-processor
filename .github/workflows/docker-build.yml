name: Docker Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**/__tests__/**'
      - '**/e2e/**'
      - '**/*.md'
      - '.github/workflows/**'
      - 'jest.config.js'
      - 'config/jest/**'
      - 'eslint.config.mjs'
      - 'config/playwright/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/__tests__/**'
      - '**/e2e/**'
      - '**/*.md'
      - '.github/workflows/**'
      - 'jest.config.js'
      - 'config/jest/**'
      - 'eslint.config.mjs'
      - 'config/playwright/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Needed for changed-files action

      - name: Check for relevant file changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            src:
              - '!**/__tests__/**'
              - '!**/e2e/**'
              - '!**/*.md'
              - '!.github/workflows/**'
              - '!jest.*.js'
              - '!config/jest/**'
              - '!eslint.config.mjs'
              - '!config/playwright/**'
              - '**'

      - name: Output build decision
        run: |
          if [[ "${{ steps.changed-files.outputs.src_any_changed }}" == "true" || ("${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/ ) ]]; then
            echo "Building Docker images because relevant files have changed or this is a tag push"
            echo "SHOULD_BUILD=true" >> $GITHUB_ENV
          else
            echo "Skipping Docker build because only test files were changed"
            echo "SHOULD_BUILD=false" >> $GITHUB_ENV
          fi

          # Debug output
          echo "Changed files: ${{ steps.changed-files.outputs.src_all_changed_files }}"
          echo "Any changed: ${{ steps.changed-files.outputs.src_any_changed }}"

      - name: Read version
        id: version
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.SHOULD_BUILD == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push main application image
      - name: Extract metadata for main app
        if: env.SHOULD_BUILD == 'true'
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/nextjs-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push main app image
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test the built images
      - name: Test Docker image permissions
        if: env.SHOULD_BUILD == 'true'
        run: |
          echo "Testing Docker image permissions..."
          
          # Create test uploads directory
          mkdir -p test-uploads
          chmod 755 test-uploads
          
          # Get the first tag from meta-app (tags are newline-separated)
          IMAGE_TAG=$(echo "${{ steps.meta-app.outputs.tags }}" | head -n1)
          echo "Testing image: $IMAGE_TAG"
          
          # Test that entrypoint script exists and works
          echo "Testing entrypoint script..."
          docker run --rm \
            -v "$(pwd)/test-uploads:/app/public/uploads" \
            "$IMAGE_TAG" \
            sh -c "
              test -f /entrypoint.sh && echo '✓ Entrypoint script exists' || (echo '✗ Entrypoint script missing' && exit 1)
              command -v su-exec && echo '✓ su-exec installed' || (echo '✗ su-exec missing' && exit 1)
              touch /app/public/uploads/.test-write && rm /app/public/uploads/.test-write && echo '✓ Write permissions working'
            " || (echo "✗ Permission test failed" && exit 1)
          
          # Cleanup
          rm -rf test-uploads
          echo "✓ Docker image permission tests passed"

      # sharp is a native module: make sure it loads and processes images in the Alpine image
      - name: Test the processing API in the image
        if: env.SHOULD_BUILD == 'true'
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta-app.outputs.tags }}" | head -n1)
          CONTAINER_ID=$(docker run -d -p 3005:3000 \
            -e PROCESS_API_KEY=ci-process-key -e CLEANUP_API_KEY=ci-cleanup-key \
            "$IMAGE_TAG")
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3005/api/healthcheck > /dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "✗ App did not start"; docker logs "$CONTAINER_ID"; exit 1; }
            sleep 2
          done

          for fixture in product.jfif logo.svg; do
            status=$(curl -s -o out.png -w '%{http_code}' \
              -H "Authorization: Bearer ci-process-key" \
              -F "file=@e2e/fixtures/import/$fixture" \
              http://localhost:3005/api/process)
            if [ "$status" != "200" ] || [ "$(head -c 8 out.png | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "✗ /api/process failed for $fixture (HTTP $status)"; cat out.png; docker logs "$CONTAINER_ID"; exit 1
            fi
            # A PNG's width and height are bytes 17-24 of the file
            size=$(head -c 24 out.png | tail -c 8 | od -An -tu1 | awk '{print $3*256+$4 "x" $7*256+$8}')
            [ "$size" = "1500x1500" ] || { echo "✗ Unexpected size $size for $fixture"; exit 1; }
            echo "✓ /api/process returned a 1500x1500 PNG for $fixture"
          done

          # Chunked upload: the image must accept the 60 KB headers it advertises
          auth="Authorization: Bearer ci-process-key"
          base="http://localhost:3005/api/process/uploads"
          # A ~270 KB PNG of noise (stored, uncompressed), so the upload takes several full-size chunks
          image=noise.png
          python3 - "$image" <<'PY'
          import os, struct, sys, zlib
          w = h = 300
          rows = b''.join(b'\0' + os.urandom(w * 3) for _ in range(h))
          chunk = lambda kind, data: struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(rows, 0)) + chunk(b'IEND', b'')
          open(sys.argv[1], 'wb').write(png)
          PY
          start=$(curl -fsS -X POST -H "$auth" -H "X-Upload-Size: $(stat -c %s "$image")" -H "X-Upload-Name: noise.png" "$base")
          id=$(echo "$start" | jq -r .id)
          chunk_chars=$(echo "$start" | jq -r .chunkChars)
          [ "$chunk_chars" = "61440" ] || { echo "✗ chunkChars is $chunk_chars, expected 61440"; docker logs "$CONTAINER_ID"; exit 1; }
          # One chunk per line; the trailing newline lets read see the last one
          { base64 -w0 "$image" | fold -w "$chunk_chars"; echo; } > chunks.txt
          index=0
          while read -r piece && [ -n "$piece" ]; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$auth" -H "X-Chunk-Data: $piece" "$base/$id/chunks/$index")
            [ "$status" = "200" ] || { echo "✗ chunk $index failed (HTTP $status)"; docker logs "$CONTAINER_ID"; exit 1; }
            index=$((index + 1))
          done < chunks.txt
          curl -fsS -X POST -H "$auth" "$base/$id/process" | jq -r .png | base64 -d > chunked.png
          size=$(head -c 24 chunked.png | tail -c 8 | od -An -tu1 | awk '{print $3*256+$4 "x" $7*256+$8}')
          [ "$size" = "1500x1500" ] || { echo "✗ Chunked upload returned $size"; exit 1; }
          [ "$index" -gt 1 ] || { echo "✗ Expected several chunks, sent $index"; exit 1; }
          echo "✓ Chunked upload of $index chunks of up to $chunk_chars characters returned a 1500x1500 PNG"
          docker rm -f "$CONTAINER_ID" > /dev/null
